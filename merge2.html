<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证件拼版 · 一张纸打多个</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f6f1e7; color:#3d3a34; min-height:100vh; padding:16px; }
h1 { font-size:20px; margin-bottom:4px; }
.sub { font-size:13px; color:#8a8378; margin-bottom:16px; }
.card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.card h2 { font-size:14px; margin-bottom:10px; color:#6b5d4f; }
.upload { border:2px dashed #d9cfbc; border-radius:10px; padding:16px; text-align:center; cursor:pointer; color:#8a8378; font-size:14px; background:#fdfbf6; }
.upload input { display:none; }
.imgrow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #f0eadc; }
.imgrow:last-child { border-bottom:none; }
.imgrow img { width:56px; height:56px; object-fit:cover; border-radius:8px; background:#eee; flex:none; }
.imgrow .info { flex:1; min-width:0; }
.imgrow .info .t { font-size:13px; font-weight:600; }
.imgrow .info .n { font-size:11px; color:#8a8378; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.imgrow .ops { display:flex; gap:6px; flex:none; }
.btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:600; color:#fff; background:#7fb069; margin-top:4px; cursor:pointer; }
.btn:disabled { background:#c8c2b4; }
.btn.sec { background:#b08d57; margin-top:10px; }
.btn.gray { background:#9a9286; }
.btn.small { padding:8px 12px; font-size:13px; width:auto; margin:0; }
.btn.red { background:#c96a5b; }
.canvas-wrap { text-align:center; }
canvas { max-width:100%; border-radius:8px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.steps { font-size:13px; line-height:1.9; color:#5a554c; }
.steps b { color:#7fb069; }
.toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#3d3a34; color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; }
.toast.show { opacity:.92; }
.cropbar { display:flex; gap:10px; margin-top:12px; }
.cropbar .btn { flex:1; margin-top:0; }
#cropView { display:none; }
#cropCanvas { width:100%; background:#fff; }
.slider-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
.slider-row label { font-size:13px; color:#6b5d4f; width:44px; flex:none; text-align:right; }
.slider-row input[type=range] { flex:1; height:44px; accent-color:#7fb069; }
.slider-row .val { font-size:12px; color:#8a8378; width:34px; flex:none; }
</style>
</head>
<body>
<h1>证件拼版 · 一张纸打多个</h1>
<div class="sub">添加任意张扫描图，各自裁剪，自动排到同一张 A4（2张上下 / 4张2x2）</div>

<!-- 主界面 -->
<div id="mainView">
  <div class="card">
    <h2>1. 添加图片（户口本4页就加4张）</h2>
    <div class="upload" id="addBox">＋ 添加图片（可多选，或分次添加）<input type="file" id="fileIn" accept="image/*" multiple></div>
    <div id="imgList"></div>
  </div>

  <div class="card">
    <h2>2. 生成拼版图</h2>
    <div class="canvas-wrap">
      <canvas id="prev"></canvas>
    </div>
    <button class="btn" id="gen" disabled style="margin-top:10px;">生成 A4 拼版图</button>
    <canvas id="cv" style="display:none;margin-top:12px;"></canvas>
    <button class="btn sec" id="save" style="display:none;">保存拼好的图到相册</button>
  </div>

  <div class="card">
    <h2>打印</h2>
    <div class="steps">
      相册打开保存的图 → <b>Canon PRINT 照片打印</b> → 纸张 <b>A4</b>、<b>无边框关</b>。
    </div>
  </div>
</div>

<!-- 裁剪界面 -->
<div id="cropView">
  <div class="card">
    <h2 id="cropTitle">调整裁剪</h2>
    <div class="canvas-wrap">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="hint" style="margin-top:6px;">用下面 4 个滑块调整绿框的四条边，把证件框住就行。</div>
    <div class="slider-row"><label>左边</label><input type="range" id="sL" min="0" max="100" step="0.5"><span class="val" id="vL"></span></div>
    <div class="slider-row"><label>右边</label><input type="range" id="sR" min="0" max="100" step="0.5"><span class="val" id="vR"></span></div>
    <div class="slider-row"><label>上边</label><input type="range" id="sT" min="0" max="100" step="0.5"><span class="val" id="vT"></span></div>
    <div class="slider-row"><label>下边</label><input type="range" id="sB" min="0" max="100" step="0.5"><span class="val" id="vB"></span></div>
    <button class="btn gray" id="cropReset" style="margin-top:12px;">恢复自动识别</button>
    <div class="cropbar" style="margin-top:10px;">
      <button class="btn gray" id="cropCancel">取消</button>
      <button class="btn" id="cropOk">确认裁剪</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let imgs=[]; // {img, box, name}
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2600); }

// 自动检测（只在上传时初始化一次，之后完全由用户控制）
function detectBox(img){
  const S=900;
  const r=S/img.width, w=S, h=Math.round(img.height*r);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  ctx.drawImage(img,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;
  const rowH=new Array(h).fill(0), colW=new Array(w).fill(0);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4, R=d[i], G=d[i+1], B=d[i+2];
    const mx=Math.max(R,G,B), mn=Math.min(R,G,B);
    if(mx-mn>28 || mx<215){ rowH[y]++; colW[x]++; }
  }
  const thr=Math.max(4, w*0.012);
  let y0=-1,y1=-1;
  for(let y=0;y<h;y++){ if(rowH[y]>=thr){ if(y0<0)y0=y; y1=y; } }
  let x0=-1,x1=-1;
  for(let x=0;x<w;x++){ if(colW[x]>=thr){ if(x0<0)x0=x; x1=x; } }
  if(y0<0||x0<0) return {x:0,y:0,w:img.width,h:img.height};
  const pad=Math.round(Math.min(w,h)*0.012);
  y0=Math.max(0,y0-pad); y1=Math.min(h-1,y1+pad);
  x0=Math.max(0,x0-pad); x1=Math.min(w-1,x1+pad);
  return { x:x0/r, y:y0/r, w:(x1-x0+1)/r, h:(y1-y0+1)/r };
}

function loadFiles(files){
  const list=[...files].filter(f=>f.type&&f.type.startsWith('image/'));
  if(!list.length){ toast('没选到图片'); return; }
  list.forEach(f=>{
    const img=new Image();
    img.onload=()=>{
      imgs.push({ img, box:detectBox(img), name:f.name||('第'+(imgs.length+1)+'张') });
      renderList();
      if(imgs.length>=2) toast('已加 '+imgs.length+' 张，继续加或去生成');
    };
    img.onerror=()=>toast('图片读取失败：'+f.name);
    img.src=URL.createObjectURL(f);
  });
}

function renderList(){
  const box=$('imgList');
  box.innerHTML='';
  imgs.forEach((it,i)=>{
    const row=document.createElement('div');
    row.className='imgrow';
    row.innerHTML='<img src="'+it.img.src+'">'+
      '<div class="info"><div class="t">第'+(i+1)+'张</div><div class="n">'+it.name+'</div></div>'+
      '<div class="ops"><button class="btn gray small" data-c="'+i+'">裁剪</button>'+
      '<button class="btn red small" data-d="'+i+'">删</button></div>';
    row.querySelector('[data-c]').addEventListener('click', ()=>openCrop(i));
    row.querySelector('[data-d]').addEventListener('click', ()=>{ imgs.splice(i,1); renderList(); });
    box.appendChild(row);
  });
  $('gen').disabled = imgs.length<1;
  drawPrev();
}

function drawPrev(){
  const cv=$('prev');
  if(!imgs.length){ cv.style.display='none'; return; }
  cv.style.display='block';
  const W=760;
  const n=imgs.length;
  const cols= n<=2?1:2;
  const rows=Math.ceil(n/cols);
  const cellW=W/cols, cellH=Math.round(cellW*1.3);
  cv.width=W; cv.height=cellH*rows;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#eee'; ctx.fillRect(0,0,W,cv.height);
  imgs.forEach((it,i)=>{
    const cx=(i%cols)*cellW, cy=Math.floor(i/cols)*cellH;
    ctx.fillStyle='#fff'; ctx.fillRect(cx+2,cy+2,cellW-4,cellH-4);
    const img=it.img, b=it.box;
    // 缩略：整图淡底
    const r1=Math.min((cellW-12)/img.width,(cellH-12)/img.height);
    ctx.globalAlpha=0.25;
    ctx.drawImage(img, cx+(cellW-img.width*r1)/2, cy+(cellH-img.height*r1)/2, img.width*r1, img.height*r1);
    ctx.globalAlpha=1;
    // 绿框裁剪部分
    const r2=Math.min((cellW-10)/b.w,(cellH-10)/b.h);
    ctx.drawImage(img, b.x,b.y,b.w,b.h, cx+(cellW-b.w*r2)/2, cy+(cellH-b.h*r2)/2, b.w*r2, b.h*r2);
    ctx.strokeStyle='#4caf50'; ctx.lineWidth=2;
    ctx.strokeRect(cx+(cellW-b.w*r2)/2, cy+(cellH-b.h*r2)/2, b.w*r2, b.h*r2);
    ctx.fillStyle='#3d3a34'; ctx.font='bold 12px sans-serif';
    ctx.fillText('第'+(i+1)+'张', cx+8, cy+20);
  });
}

// ===== 滑块裁剪 =====
let editing=null; // {img, box, idx}
const S={L:$('sL'),R:$('sR'),T:$('sT'),B:$('sB')};

function boxToSliders(){
  const b=editing.box, img=editing.img;
  S.L.value=(b.x/img.width*100).toFixed(1);
  S.R.value=((b.x+b.w)/img.width*100).toFixed(1);
  S.T.value=(b.y/img.height*100).toFixed(1);
  S.B.value=((b.y+b.h)/img.height*100).toFixed(1);
  updVals();
}
function updVals(){
  $('vL').textContent=S.L.value+'%';
  $('vR').textContent=S.R.value+'%';
  $('vT').textContent=S.T.value+'%';
  $('vB').textContent=S.B.value+'%';
}
function slidersToBox(){
  const b=editing.box, img=editing.img;
  let L=parseFloat(S.L.value), R=parseFloat(S.R.value);
  let T=parseFloat(S.T.value), B=parseFloat(S.B.value);
  if(R-L<3){ if(this===S.L) L=R-3; else R=L+3; S.L.value=L; S.R.value=R; }
  if(B-T<3){ if(this===S.T) T=B-3; else B=T+3; S.T.value=T; S.B.value=B; }
  b.x=img.width*L/100; b.w=img.width*(R-L)/100;
  b.y=img.height*T/100; b.h=img.height*(B-T)/100;
  updVals();
  drawCrop();
}

function drawCrop(){
  const cv=$('cropCanvas'), img=editing.img;
  const W=cv.clientWidth||640;
  const H=Math.round(W*img.height/img.width);
  cv.width=W*2; cv.height=H*2;
  const ctx=cv.getContext('2d');
  const s=2;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W*s,H*s);
  ctx.drawImage(img,0,0,W*s,H*s);
  const b=editing.box, sx=b.x*W*s/img.width, sy=b.y*W*s/img.height, sw=b.w*W*s/img.width, sh=b.h*W*s/img.height;
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.fillRect(0,0,W*s,sy);
  ctx.fillRect(0,sy+sh,W*s,H*s-sy-sh);
  ctx.fillRect(0,sy,sx,sh);
  ctx.fillRect(sx+sw,sy,W*s-sx-sw,sh);
  ctx.strokeStyle='#4caf50'; ctx.lineWidth=3;
  ctx.strokeRect(sx,sy,sw,sh);
}

function openCrop(idx){
  const it=imgs[idx];
  if(!it) return;
  editing={ img:it.img, box:it.box, idx };
  $('cropTitle').textContent='裁剪 第'+(idx+1)+'张';
  $('mainView').style.display='none';
  $('cropView').style.display='block';
  boxToSliders();
  drawCrop();
}
$('cropCancel').addEventListener('click', ()=>{ editing=null; $('cropView').style.display='none'; $('mainView').style.display='block'; });
$('cropOk').addEventListener('click', ()=>{
  const idx=editing?editing.idx:-1;
  editing=null;
  $('cropView').style.display='none';
  $('mainView').style.display='block';
  renderList();
  toast('第'+(idx+1)+'张裁剪已保存');
});
$('cropReset').addEventListener('click', ()=>{
  editing.box = detectBox(editing.img);
  boxToSliders(); drawCrop();
});
['L','R','T','B'].forEach(k=>{
  S[k].addEventListener('input', slidersToBox);
});

// 添加图片
$('addBox').addEventListener('click', ()=>$('fileIn').click());
$('fileIn').addEventListener('change', e=>{
  if(e.target.files.length) loadFiles(e.target.files);
  e.target.value='';
});

// 生成拼版
$('gen').addEventListener('click', ()=>{
  if(!imgs.length){ toast('先添加图片'); return; }
  const PW=1240, PH=1754;
  const cv=$('cv'); cv.width=PW; cv.height=PH;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH);
  const n=imgs.length;
  const cols= n<=2?1:2;
  const rows=Math.ceil(n/cols);
  const m=40, gap=12;
  const cellW=(PW-m*2-gap*(cols-1))/cols;
  const cellH=(PH-m*2-gap*(rows-1))/rows;
  imgs.forEach((it,i)=>{
    const cx=m+(i%cols)*(cellW+gap), cy=m+Math.floor(i/cols)*(cellH+gap);
    const b=it.box, img=it.img;
    const r=Math.min(cellW/b.w, cellH/b.h);
    const w=b.w*r, h=b.h*r;
    ctx.drawImage(img, b.x,b.y,b.w,b.h, cx+(cellW-w)/2, cy+(cellH-h)/2, w, h);
  });
  cv.style.display='block';
  $('save').style.display='block';
  toast('拼好了！保存去打印吧');
});

$('save').addEventListener('click', ()=>{
  const a=document.createElement('a');
  a.href=$('cv').toDataURL('image/png');
  a.download='证件拼版_A4.png';
  a.click();
  toast('已保存，去相册用 Canon PRINT 打印');
});
</script>
</body>
</html>
