<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>贴纸素材库 · KK的日记</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #2b3a55 0%, #1a2333 70%, #121826 100%);
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    color:#dfe7f5;
    display:flex; flex-direction:column;
    min-height:100%;
  }
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 10px;
  }
  header h1 { font-size:1.1em; letter-spacing:.12em; color:#f5ecd7; font-weight:700; }
  header h1 small { display:block; font-size:.6em; color:#8f9dbb; letter-spacing:.1em; margin-top:2px; font-weight:400; }
  .back-btn {
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
    color:#dfe7f5; border-radius:18px; padding:.4em .9em; font-size:.8em; cursor:pointer;
    text-decoration:none;
  }
  .back-btn:active { background:rgba(255,255,255,.18); }
  /* 分类栏 */
  .cats {
    display:flex; gap:8px; padding:6px 16px 12px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar { display:none; }
  .cat {
    flex-shrink:0; background:rgba(255,255,255,.07); color:#b9c6e0;
    border:1px solid transparent; border-radius:16px; padding:.35em .9em; font-size:.8em;
    cursor:pointer; white-space:nowrap;
  }
  .cat.active { background:rgba(232,201,122,.18); color:#e8c97a; border-color:rgba(232,201,122,.4); }
  /* 网格 */
  .grid-wrap { flex:1; overflow-y:auto; padding:0 14px 90px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .st {
    background:rgba(255,255,255,.06); border-radius:12px; padding:10px;
    display:flex; flex-direction:column; align-items:center;
    border:1px solid rgba(255,255,255,.06);
  }
  .st img { width:86%; aspect-ratio:1; object-fit:contain; }
  .st .nm { font-size:.62em; color:#8f9dbb; margin-top:6px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .empty { text-align:center; color:#5c6b8c; font-size:.8em; padding:40px 0; }
  /* 上传按钮 */
  .fab {
    position:fixed; right:18px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#e8c97a,#d4a94e); color:#2a2114;
    font-size:1.6em; border:none; box-shadow:0 6px 18px rgba(0,0,0,.4);
    cursor:pointer; z-index:20;
  }
  .fab:active { transform:scale(.94); }
  /* 上传面板 */
  .mask {
    position:fixed; inset:0; background:rgba(10,14,24,.72); z-index:30;
    display:none; align-items:flex-end; justify-content:center;
  }
  .mask.show { display:flex; }
  .panel {
    background:#232c42; width:100%; border-radius:20px 20px 0 0; padding:18px 18px 30px;
    max-height:80vh; overflow-y:auto;
  }
  .panel h3 { font-size:.95em; color:#f5ecd7; margin-bottom:12px; }
  .panel label { display:block; font-size:.75em; color:#8f9dbb; margin:10px 0 6px; }
  .panel select {
    width:100%; background:#1a2333; color:#dfe7f5; border:1px solid rgba(255,255,255,.15);
    border-radius:10px; padding:.6em; font-size:.9em;
  }
  .file-box {
    border:2px dashed rgba(255,255,255,.2); border-radius:12px; padding:22px;
    text-align:center; color:#8f9dbb; font-size:.8em; cursor:pointer; margin-top:6px;
  }
  .file-box.has { border-color:rgba(232,201,122,.5); color:#e8c97a; }
  .preview { max-width:90px; max-height:90px; margin:10px auto 0; display:none; border-radius:8px; }
  .panel .row { display:flex; gap:10px; margin-top:16px; }
  .panel button {
    flex:1; border-radius:22px; padding:.7em; font-size:.92em; border:none; cursor:pointer;
  }
  .btn-ok { background:linear-gradient(135deg,#e8c97a,#d4a94e); color:#2a2114; font-weight:600; }
  .btn-ok:disabled { opacity:.5; }
  .btn-no { background:rgba(255,255,255,.1); color:#dfe7f5; }
  .toast {
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:rgba(20,28,44,.95); color:#f5ecd7; border:1px solid rgba(232,201,122,.4);
    border-radius:20px; padding:.6em 1.4em; font-size:.82em; z-index:40;
    display:none; white-space:nowrap;
  }
  .toast.show { display:block; }
</style>
</head>
<body>
<header>
  <h1>KK 的 贴纸素材库<small>STICKER BOX · 分类收纳 · 随时上传</small></h1>
  <a class="back-btn" href="index.html">‹ 回日记本</a>
</header>

<div class="cats" id="cats"></div>
<div class="grid-wrap"><div class="grid" id="grid"></div></div>

<button class="fab" id="fab">＋</button>

<div class="mask" id="mask">
  <div class="panel">
    <h3>上传新贴纸</h3>
    <label>选择分类</label>
    <select id="catSel">
      <option>花草</option><option>星星月亮</option><option>天空</option>
      <option>爱心</option><option>小动物</option><option>表情包照片</option><option>其他</option>
    </select>
    <label>给它起个名字（可选，方便以后找）</label>
    <input type="text" id="titleInput" maxlength="30" placeholder="例如：拽猫表情包" style="width:100%; background:#1a2333; color:#dfe7f5; border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:.6em; font-size:.9em; box-sizing:border-box;">
    <label>选择图片</label>
    <div class="file-box" id="fileBox">点这里选图片（支持 PNG / JPG / GIF / WEBP）</div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <img class="preview" id="preview" alt="preview">
    <div class="row">
      <button class="btn-no" id="btnCancel">取消</button>
      <button class="btn-ok" id="btnOk" disabled>上传</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 静态贴纸（KK手绘第一批，在网站文件里）
  const STATIC_STICKERS = [
    { file:'flower_red',   cat:'花草',     label:'红花' },
    { file:'flower_pink',  cat:'花草',     label:'粉花' },
    { file:'flower_purple',cat:'花草',     label:'紫花' },
    { file:'flower_blue',  cat:'花草',     label:'蓝花' },
    { file:'star_gold',    cat:'星星月亮', label:'星星' },
    { file:'moon',         cat:'星星月亮', label:'月牙' },
    { file:'cloud',        cat:'天空',     label:'云朵' },
    { file:'rainbow',      cat:'天空',     label:'彩虹' },
    { file:'sun',          cat:'天空',     label:'太阳' },
    { file:'heart_red',    cat:'爱心',     label:'红心' },
    { file:'heart_pink',   cat:'爱心',     label:'粉心' },
    { file:'butterfly',    cat:'小动物',   label:'蝴蝶' },
    { file:'paw',          cat:'小动物',   label:'猫爪' },
  ];
  const CATS = ['全部','花草','星星月亮','天空','爱心','小动物','表情包照片','其他'];

  let dynStickers = [];   // 云端动态素材
  let currentCat = '全部';

  const grid = document.getElementById('grid');
  const catsEl = document.getElementById('cats');

  // 分类栏
  CATS.forEach(c => {
    const b = document.createElement('div');
    b.className = 'cat' + (c === currentCat ? ' active' : '');
    b.textContent = c;
    b.onclick = () => { currentCat = c; renderCats(); render(); };
    catsEl.appendChild(b);
  });
  function renderCats() {
    [...catsEl.children].forEach((el, i) => {
      el.classList.toggle('active', CATS[i] === currentCat);
    });
  }

  function allStickers() {
    const statics = STATIC_STICKERS.map(s => ({
      key: 'static:' + s.file,
      name: s.label,
      category: s.cat,
      src: 'stickers/' + s.file + '.png',
    }));
    const dyns = dynStickers.map(d => ({
      key: d.key,
      name: d.name,
      title: d.title || '',
      category: d.category,
      src: '/.netlify/functions/serve?key=' + encodeURIComponent(d.key),
    }));
    return statics.concat(dyns);
  }

  function render() {
    const list = allStickers().filter(s => currentCat === '全部' || s.category === currentCat);
    grid.innerHTML = '';
    if (!list.length) {
      grid.innerHTML = '<div class="empty">这个分类还空着，点右下角 ＋ 上传第一个吧</div>';
      return;
    }
    list.forEach(s => {
      const d = document.createElement('div');
      d.className = 'st';
      const img = document.createElement('img');
      img.src = s.src; img.loading = 'lazy'; img.alt = s.name;
      const nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = s.title || s.name;
      d.appendChild(img); d.appendChild(nm);
      grid.appendChild(d);
    });
  }

  async function loadDyn() {
    try {
      const r = await fetch('/.netlify/functions/list');
      dynStickers = await r.json();
    } catch (e) { dynStickers = []; }
    render();
  }

  // ---- 上传 ----
  const mask = document.getElementById('mask');
  const fileInput = document.getElementById('fileInput');
  const fileBox = document.getElementById('fileBox');
  const preview = document.getElementById('preview');
  const btnOk = document.getElementById('btnOk');
  let picked = null;

  document.getElementById('fab').onclick = () => mask.classList.add('show');
  document.getElementById('btnCancel').onclick = () => { mask.classList.remove('show'); resetPick(); };
  fileBox.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { toast('图片太大啦，请选 5MB 以内的'); return; }
    picked = f;
    fileBox.textContent = f.name;
    fileBox.classList.add('has');
    preview.src = URL.createObjectURL(f);
    preview.style.display = 'block';
    btnOk.disabled = false;
  };
  btnOk.onclick = async () => {
    if (!picked) return;
    btnOk.disabled = true; btnOk.textContent = '上传中…';
    try {
      const reader = new FileReader();
      const data = await new Promise((res, rej) => {
        reader.onload = () => res(String(reader.result).split(',')[1]);
        reader.onerror = rej;
        reader.readAsDataURL(picked);
      });
      const resp = await fetch('/.netlify/functions/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: picked.name,
          title: document.getElementById('titleInput').value.trim(),
          category: document.getElementById('catSel').value,
          data,
          type: picked.type || 'image/png',
        }),
      });
      const j = await resp.json();
      if (!j.ok) throw new Error(j.error || '上传失败');
      toast('上传成功！已放进素材库');
      mask.classList.remove('show'); resetPick();
      await loadDyn();
    } catch (e) {
      toast('上传失败：' + (e.message || e));
      btnOk.disabled = false; btnOk.textContent = '上传';
    }
  };
  function resetPick() {
    picked = null; fileInput.value = '';
    document.getElementById('titleInput').value = '';
    fileBox.textContent = '点这里选图片（支持 PNG / JPG / GIF / WEBP）';
    fileBox.classList.remove('has');
    preview.style.display = 'none';
    btnOk.disabled = true; btnOk.textContent = '上传';
  }

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  loadDyn();
</script>
</body>
</html>
