<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证件正反同面 · 拼版工具</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f6f1e7; color:#3d3a34; min-height:100vh; padding:16px; }
h1 { font-size:20px; margin-bottom:4px; }
.sub { font-size:13px; color:#8a8378; margin-bottom:16px; }
.card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.card h2 { font-size:14px; margin-bottom:10px; color:#6b5d4f; }
.upload { border:2px dashed #d9cfbc; border-radius:10px; padding:14px; text-align:center; cursor:pointer; color:#8a8378; font-size:13px; background:#fdfbf6; }
.upload.on { border-color:#7fb069; background:#f2f8ee; }
.upload input { display:none; }
.thumb { display:flex; gap:10px; margin-top:10px; }
.thumb img { width:calc(50% - 5px); border-radius:8px; background:#eee; min-height:80px; object-fit:contain; }
.btn { display:block; width:100%; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:600; color:#fff; background:#7fb069; margin-top:4px; cursor:pointer; }
.btn:disabled { background:#c8c2b4; }
.btn.sec { background:#b08d57; margin-top:10px; }
.canvas-wrap { text-align:center; }
canvas { max-width:100%; border-radius:8px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.12); }
.hint { font-size:12px; color:#8a8378; line-height:1.7; margin-top:8px; }
.steps { font-size:13px; line-height:1.9; color:#5a554c; }
.steps b { color:#7fb069; }
.toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#3d3a34; color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9; }
.toast.show { opacity:.92; }
</style>
</head>
<body>
<h1>证件正反同面 · 拼版</h1>
<div class="sub">把扫描的正反两张图拼到同一张 A4，保存后打印</div>

<div class="card">
  <h2>1. 选图片（正面 / 反面）</h2>
  <div class="upload" id="boxF">点这里选 <b>正面</b> 扫描图<input type="file" id="fileF" accept="image/*"></div>
  <div class="upload" id="boxB" style="margin-top:8px;">点这里选 <b>反面</b> 扫描图<input type="file" id="fileB" accept="image/*"></div>
  <div class="thumb" id="thumbs" style="display:none;"></div>
</div>

<div class="card">
  <h2>2. 生成拼版图</h2>
  <button class="btn" id="gen" disabled>生成 A4 拼版图</button>
  <div class="canvas-wrap" id="wrap" style="display:none;margin-top:12px;">
    <canvas id="cv"></canvas>
  </div>
  <button class="btn sec" id="save" style="display:none;">保存图片到相册</button>
</div>

<div class="card">
  <h2>打印小贴士</h2>
  <div class="steps">
    保存后在相册打开 → 用 <b>Canon PRINT</b> 打印 → 纸张选 <b>A4</b>、<b>无边框关</b>、质量普通即可。<br>
    若打印机弹密码，就点 <b>扫描→照片打印</b> 那条线（扫描不弹密码），或先重置密码。
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let imgF=null, imgB=null;
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }

function bindUpload(boxId, fileId, tag){
  const box=$(boxId), file=$(fileId);
  box.addEventListener('click', ()=>file.click());
  file.addEventListener('change', ()=>{
    const f=file.files[0]; if(!f) return;
    const img=new Image();
    img.onload=()=>{
      if(tag==='F') imgF=img; else imgB=img;
      box.classList.add('on');
      box.innerHTML='已选 '+(tag==='F'?'正面':'反面')+'（'+(f.name||'')+'）<input type="file" id="'+fileId+'" accept="image/*">';
      bindUpload(boxId,fileId,tag);
      const th=$('thumbs');
      th.style.display='flex';
      th.innerHTML='<img src="'+img.src+'"><img src="'+(tag==='F'?(imgB?imgB.src:''):(imgF?imgF.src:''))+'">';
      $('gen').disabled = !(imgF&&imgB);
      if(imgF&&imgB) toast('两张都好了，点生成！');
    };
    img.onerror=()=>toast('图片读取失败，换一张');
    img.src=URL.createObjectURL(f);
  });
}
bindUpload('boxF','fileF','F');
bindUpload('boxB','fileB','B');

$('gen').addEventListener('click', ()=>{
  if(!imgF||!imgB){ toast('先选两张图'); return; }
  const W=1240, H=1754; // A4 @150dpi
  const cv=$('cv'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  const gap=28; // 中间间隙
  const areaH=(H-gap*2-gap)/2; // 每半页
  const areaW=W-gap*2;
  function drawHalf(img, y){
    const r=Math.min(areaW/img.width, areaH/img.height);
    const w=img.width*r, h=img.height*r;
    ctx.drawImage(img, (W-w)/2, y+(areaH-h)/2, w, h);
  }
  drawHalf(imgF, gap);
  drawHalf(imgB, gap*2+areaH);
  ctx.strokeStyle='#ddd'; ctx.lineWidth=1;
  ctx.setLineDash([8,8]); ctx.strokeRect(gap-10,gap+areaH-14,areaW+20,2);
  $('wrap').style.display='block';
  $('save').style.display='block';
  toast('拼好了，保存吧！');
});

$('save').addEventListener('click', ()=>{
  const a=document.createElement('a');
  a.href=$('cv').toDataURL('image/png');
  a.download='证件正反同面_A4.png';
  a.click();
  toast('已保存，去相册用 Canon PRINT 打印');
});
</script>
</body>
</html>
